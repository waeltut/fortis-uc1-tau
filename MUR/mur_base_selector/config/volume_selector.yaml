# Online volume selector; no IK calls.
mur_base_selector:
  ros__parameters:
    fixed_frame: map
    base_frame: base_link
    reachability_frame: odom
    arm_mode: either
    service_timeout: 3.0
    planner_action: /compute_path_to_pose
    planner_id: GridBased
    global_costmap_service: /global_costmap/get_costmap
    local_costmap_service: /local_costmap/get_costmap
    footprint_topic: /local_costmap/published_footprint
    joint_states_topic: /joint_states
    scan_topic: /scan
    lifecycle_services:
    - /planner_server/get_state
    - /controller_server/get_state
    arm_joints:
    - left_shoulder_pan_joint
    - left_shoulder_lift_joint
    - left_elbow_joint
    - left_wrist_1_joint
    - left_wrist_2_joint
    - left_wrist_3_joint
    - right_shoulder_pan_joint
    - right_shoulder_lift_joint
    - right_elbow_joint
    - right_wrist_1_joint
    - right_wrist_2_joint
    - right_wrist_3_joint
    max_data_age: 3.0
    tf_timeout: 0.5
    footprint_padding: 0.02
    allow_unknown: false
    max_path_checks: 8
    path_timeout: 1.0
    cancel_timeout: 2.0
    diversity_distance: 0.2
    diversity_angle: 0.35
    path_linear_step: 0.05
    path_angular_step: 0.08
    start_xy_tolerance: 0.05
    endpoint_xy_tolerance: 0.02
    endpoint_yaw_tolerance: 0.03
    base_motion_tolerance: 0.03
    base_rotation_tolerance: 0.03
    joint_motion_tolerance: 0.04
    length_scale: 5.0
    selection_ttl: 15.0
    publish_visualization_data: true
    visualization_max_candidates: 6000
    selection_budget: 30.0
    final_validation_reserve: 2.0
    ranking_pool_size: 160
    max_destination_checks: 80
    target_feasible_paths: 3
    front_fov_deg: 250.0
    front_yaw_offset_deg: 0.0
    volume_file: ~/ros2_ws/src/MUR/mur_base_selector/config/dexterous_volume.npz
    travel_field_budget: 2.0
    yaw_bins: 24
    orientation_profiles_deg: [70.0, 90.0, 120.0]
    minimum_orientation_coverage: 0.9
    max_height_error: 0.05
    max_orientation_error_deg: 30.0
    travel_inflation_weight: 0.5
    weight_navigation: 0.2
    weight_destination_cost: 2.0
    weight_working_distance: 0.8
    weight_facing: 0.3
    distance_scale: 0.25
    left_preferred_distance: 0.75
    right_preferred_distance: 0.75
    both_preferred_distance: 0.65
    left_facing_min_deg: 0.0
    left_facing_max_deg: 60.0
    right_facing_min_deg: -60.0
    right_facing_max_deg: 0.0
    both_facing_min_deg: -10.0
    both_facing_max_deg: 10.0
