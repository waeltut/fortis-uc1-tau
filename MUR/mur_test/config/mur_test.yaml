mur_test:
  ros__parameters:
    target_topic: /mur_test/point
    selection_service: /base_selection/select
    selection_timeout: 60.0
    navigation_action: /navigate_to_pose
    base_goal_frame: map
    base_frame: base_link
    planning_frame: mur
    commander_action: /arms/move
    # Navigation always asks for confirmation; point selection commands arm movement.
    plan_only: false
    # 0 uses commander defaults; otherwise (0, 1].
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    navigation_timeout: 180.0
    arm_timeout: 180.0
    cancel_timeout: 20.0
    interface_timeout: 15.0
    commander_wait_timeout: 5.0
    tf_timeout: 5.0
