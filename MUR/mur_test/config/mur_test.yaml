mur_test:
  ros__parameters:
    target_topic: /base_selection/target
    selected_pose_topic: /base_selection/selected_pose
    selection_diagnostics_topic: /base_selection/candidate_diagnostics
    selection_result_topic: /base_selection/result
    navigation_action: /navigate_to_pose
    base_goal_frame: map
    base_frame: base_link
    planning_frame: mur
    commander_action: /arms/move
    # Automatic arm dispatch after Nav2 succeeds. Only navigation asks for input.
    confirm_navigation: true
    plan_only: false
    # 0 uses commander defaults; otherwise (0, 1].
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    navigation_timeout: 180.0
    arm_timeout: 180.0
    cancel_timeout: 20.0
    interface_timeout: 15.0
    pose_wait_timeout: 30.0
    arm_selection_timeout: 4.0
    commander_wait_timeout: 5.0
    tf_timeout: 5.0
