mur_test:
  ros__parameters:
    # Source: desired tool pose, and selected base candidate (must be PoseStamped).
    target_topic: /base_selection/target
    selected_pose_topic: /base_selection/selected_pose   # VERIFY against selector output
    joint_states_topic: /joint_states
    # Navigation
    navigation_action: /navigate_to_pose
    base_goal_frame: map
    navigation_timeout: 180.0
    # MoveIt
    ik_service: /compute_ik
    move_group_action: /move_action
    execute_action: /execute_trajectory
    arm_group: left_ur_manipulator
    tcp_link: left_tcp
    planning_frame: world
    planning_pipeline_id: ''
    planner_id: ''
    allowed_planning_time: 10.0
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    ik_timeout: 3.0
    ik_attempts: 5
    ik_avoid_collisions: true
    joint_goal_tolerance: 0.01
    max_joint_state_age: 3.0
    max_planned_start_deviation: 0.10
    # Timeouts
    interface_timeout: 15.0
    planning_timeout: 45.0
    execution_timeout: 120.0
    pose_wait_timeout: 30.0
    tf_timeout: 5.0
