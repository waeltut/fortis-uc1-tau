/**:
  ros__parameters:
    source_node: /move_group
    scene_service: /get_planning_scene
    reference_frame: mur
    base_frame: base_link
    fixed_frame: odom
    left_group: left_ur_manipulator
    right_group: right_ur_manipulator
    left_tip: left_tcp
    right_tip: right_tcp
    cache_file: ~/ros2_ws/src/MUR/mur_reachability/config/reachability.bin
    cross_margin: 0.20
    joint_limit_margin: 0.02
    # Offline attempts per arm, FK + self collision. Not a minimum accepted count.
    samples_per_arm: 300000
    random_seed: 42
    display_voxel_size: 0.05
    # Online lookup. These are candidate search tolerances, NOT final IK tolerances.
    grid_resolution: 0.05
    yaw_bins: 24
    height_tolerance: 0.04
    orientation_tolerance_deg: 20.0
    max_candidates_per_arm: 2000
    seeds_per_cell: 3
    # Includes snapshot, search and verification; cooperative, not hard realtime.
    query_budget: 3.0
    max_verified_per_arm: 40
    ik_timeout: 0.008
    verification_position_tolerance: 0.001
    verification_orientation_tolerance: 0.01
    # Visual tiles only. Candidate base z comes from the live base TF.
    floor_z: 0.0
    # Grow verified regions using neighbouring IK solutions. Same total query budget.
    refine_area: true
    refinement_padding: 0.35
    refinement_max_verified_per_arm: 2000
