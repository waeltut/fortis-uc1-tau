# Loaded once at startup. Restart bringup after changes.
# home preserves the OLD Cartesian home targets, but does NOT command fingers.
# *_joints are copied from your existing SRDF states, not hardware-validated.
# Positions: metres; joint angles: radians; quaternion order: x,y,z,w.
presets:
  home:
    mode: both
    target_type: pose
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    left_target:
      frame_id: mur
      position:
      - 0.6
      - 0.15
      - 1.2
      orientation:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    right_target:
      frame_id: mur
      position:
      - 0.6
      - -0.15
      - 1.2
      orientation:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
  home_joints:
    mode: both
    target_type: joints
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    left_joints:
      left_elbow_joint: 0.0
      left_shoulder_lift_joint: -1.5707
      left_shoulder_pan_joint: 0.0
      left_wrist_1_joint: 0.0
      left_wrist_2_joint: 1.5707
      left_wrist_3_joint: 0.0
    right_joints:
      right_elbow_joint: 0.0
      right_shoulder_lift_joint: -1.5707
      right_shoulder_pan_joint: 0.0
      right_wrist_1_joint: 3.1415
      right_wrist_2_joint: -1.5707
      right_wrist_3_joint: -3.1415
  ready_joints:
    mode: both
    target_type: joints
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    left_joints:
      left_elbow_joint: 1.5707
      left_shoulder_lift_joint: -1.5707
      left_shoulder_pan_joint: 0.0
      left_wrist_1_joint: 0.0
      left_wrist_2_joint: 1.5707
      left_wrist_3_joint: -0.7854
    right_joints:
      right_elbow_joint: -1.5707
      right_shoulder_lift_joint: -1.5707
      right_shoulder_pan_joint: 0.0
      right_wrist_1_joint: 3.1415
      right_wrist_2_joint: -1.5707
      right_wrist_3_joint: -2.3562
