dual_arm_commander:
  ros__parameters:
    action_name: /arms/move
    joint_states_topic: /joint_states
    move_group_action: /move_action
    execute_action: /execute_trajectory
    ik_service: /compute_ik
    scene_service: /get_planning_scene
    state_validity_service: /check_state_validity
    # Fallback runs only after normal planning fails AND cross-arm target
    # collision is confirmed. No extra service calls for successful plans.
    auto_move_blocking_arm: true
    avoidance_budget: 15.0
    # Minimum modelled cross-arm separation on sampled fallback paths (metres).
    avoidance_clearance: 0.05
    avoidance_path_joint_step: 0.01
    avoidance_path_max_samples: 5000
    # Maximum final displacement per joint (radians), not a path constraint.
    avoidance_max_joint_offset: 0.7
    avoidance_max_candidates: 96
    left_tcp: left_tcp
    right_tcp: right_tcp
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    planning_time: 5.0
    planning_attempts: 5
    ik_attempts: 8
    ik_timeout: 0.5
    planning_budget: 30.0
    execution_timeout: 180.0
    response_timeout: 10.0
    cancel_timeout: 10.0
    state_max_age: 1.0
    joint_tolerance: 0.001
    start_tolerance: 0.02
    planner_id: RRTConnectkConfigDefault
    pipeline_id: ompl
