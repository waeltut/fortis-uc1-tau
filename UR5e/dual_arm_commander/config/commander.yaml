dual_arm_commander:
  ros__parameters:
    action_name: /arms/move
    joint_states_topic: /joint_states
    move_group_action: /move_action
    execute_action: /execute_trajectory
    ik_service: /compute_ik
    scene_service: /get_planning_scene
    left_tcp: left_tcp
    right_tcp: right_tcp
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    planning_time: 5.0
    planning_attempts: 5
    ik_attempts: 8
    ik_timeout: 0.5
    planning_budget: 30.0
    execution_timeout: 180.0
    response_timeout: 10.0
    cancel_timeout: 10.0
    state_max_age: 1.0
    joint_tolerance: 0.001
    start_tolerance: 0.02
    planner_id: RRTConnectkConfigDefault
    pipeline_id: ompl
