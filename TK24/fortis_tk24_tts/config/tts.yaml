# Language of the running node (one language per node).
language: en

# Where synthesized audio goes: "speaker" or "topic".
output: speaker

# Only used when output is "topic": "int16" or "float32".
topic_format: float32

# Only used when output is "speaker": sounddevice device name/index, null = system default.
audio_device: 37 # H650e


# Paths are relative to the repository root unless absolute.
# length_scale: >1 is slower.
voices:
  en:
    model: /srv/models/tts/en/en_US-lessac-medium.onnx
    length_scale: 1.0
  es:
    model: /srv/models/tts/es/es_ES-davefx-medium.onnx
    length_scale: 1.0
  pt:
    model: /srv/models/tts/pt/pt_PT-tugao-medium.onnx
    length_scale: 1.0
  tr:
    model: /srv/models/tts/tr/tr_TR-dfki-medium.onnx
    length_scale: 1.0
